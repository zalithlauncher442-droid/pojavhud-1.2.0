name: Build PojavHUD 1.2.0 Jar

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Extract Embedded PojavHUD 1.2.0 Source ZIP
      run: |
        echo "" | base64 -d > pojavhud-source.zip
        unzip -o pojavhud-source.zip

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14'

    - name: Build with Gradle
      run: gradle build --no-daemon --stacktrace

    - name: Upload Build Artifact (.jar)
      uses: actions/upload-artifact@v4
      with:
        name: pojavhud-1.2.0-jar
        path: |
          build/libs/*.jar
          !build/libs/*-sources.jar
